  <path d="M36 32h20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M36 32c8 12 14 12 20 12" stroke="#9aa0ff" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="56" cy="20" r="3.2" fill="#9aa0ff"/>
