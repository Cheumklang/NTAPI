<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 2048 2048"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="DeepSeek">
  <title>DeepSeek</title>
  <!-- A whale on the brand blue, drawn here rather than traced: the picker only
       needs to be recognisable at 20px, and the tail-and-body silhouette is what
       makes it recognisable. -->
  <rect x="0" y="0" width="2048" height="2048" rx="320" ry="320" fill="#4D6BFE" />
  <g fill="#FFFFFF">
    <!-- Body: a broad arc from the snout to the tail root. -->
    <path d="M380 900c0-190 150-340 340-340h420c260 0 470 210 470 470 0 150-70 285-180 372 40 66 96 118 168 150 26 12 34 44 12 62-120 96-282 122-424 62-96-40-172-112-220-200H720c-188 0-340-152-340-340v-236z" />
    <!-- Eye, cut out of the body. -->
    <circle cx="820" cy="760" r="62" fill="#4D6BFE" />
    <!-- Tail fluke. -->
    <path d="M1610 640c90-90 220-140 350-140 30 0 54 24 54 54 0 130-50 260-140 350l-90 90-84-84 60-60c46-46 78-104 94-166-62 16-120 48-166 94l-60 60-84-84 66-66z" />
    <!-- Belly line, keeps the mark from reading as a solid blob at small size. -->
    <path d="M560 1180h520c120 0 220-40 300-108-70 130-206 218-364 218H560z" opacity="0.55" />
  </g>
</svg>