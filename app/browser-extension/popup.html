<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 14px;
        font: 13px/1.5 system-ui, "Segoe UI", sans-serif;
        color: #e7e9ee;
        background: #14161b;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      p {
        margin: 0 0 10px;
        color: #9aa1ad;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: #9aa1ad;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font: inherit;
        letter-spacing: 0.25em;
        color: inherit;
        background: #1d2027;
        border: 1px solid #2c313b;
        border-radius: 8px;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 9px;
        font: inherit;
        color: #0b0d11;
        background: #5aa9ff;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.secondary {
        color: #e7e9ee;
        background: #232732;
        border: 1px solid #333947;
      }
      hr {
        margin: 14px 0 10px;
        border: 0;
        border-top: 1px solid #232732;
      }
      #status {
        margin-top: 10px;
        color: #9aa1ad;
      }
      #status.ok {
        color: #52c07f;
      }
      #status.bad {
        color: #e2685c;
      }
    </style>
  </head>
  <body>
    <h1>NTAPI Browser Bridge</h1>
    <p>Paste the code shown in NTAPI → the browser chip.</p>
    <label for="code">Pairing code</label>
    <input id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000" />
    <button id="save">Connect</button>
    <hr />
    <p>Hand the tab you are looking at over to the agent. It will only ever touch that one.</p>
    <button id="claim" class="secondary">ใช้แท็บที่เปิดอยู่</button>
    <div id="status">Checking...</div>
    <script src="popup.js"></script>
  </body>
</html>
