name: Release

# Push a tag like v0.1.1 to build the Windows installer and publish it.
# The installer goes to the PUBLIC repo "Cheumklang/NTAPI-releases" so that
# electron-updater can download it without a token, while this source repo
# stays private.
#
# electron-builder only *builds* here (--publish never); the upload is done by
# softprops/action-gh-release so latest.yml and the blockmap are always
# attached. electron-builder's own publisher skipped latest.yml in CI.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history and every tag: the "what's new" section is built
          # from the commits between the previous tag and this one.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Node 22 matches Electron 38 and the bundled pi SDK (fs.globSync).
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build installer (no publish)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --publish never

      - name: Show build output
        shell: pwsh
        run: Get-ChildItem dist | Select-Object Name, Length

      - name: Build release notes
        shell: pwsh
        run: |
          # What changed in THIS version, ahead of the standing description.
          # For a long time every release carried the same body — a description
          # of the program with nothing about the version, which told a returning
          # user nothing about whether to update.
          $tag = "${{ github.ref_name }}"
          $prev = & git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0 -or -not $prev) {
            $range = $tag
          } else {
            $range = "$prev..$tag"
          }
          Write-Host "changelog range: $range"

          # Commits are the changelog, but not all of them are news: housekeeping
          # (`ci:`/`chore:`/`test:`/`docs:`) says nothing to someone deciding
          # whether to update. The version bump itself is dropped too — the
          # heading already says which version this is.
          $commits = @(& git log $range --no-merges --pretty=format:"%s") |
            Where-Object { $_ -and $_ -notmatch '^(ci|chore|test|docs|style)\s*:' } |
            ForEach-Object { $_ -replace "^$([regex]::Escape($tag))\s*:\s*", '' } |
            ForEach-Object { "- $_" }

          $lines = @("## มีอะไรใหม่ใน $tag", "")
          if ($commits.Count -gt 0) { $lines += $commits }
          else { $lines += "- ปรับปรุงความเรียบร้อยภายใน" }
          $lines += @("", "---", "")
          $lines += (Get-Content RELEASE_NOTES.md -Raw)

          Set-Content -Path RELEASE_NOTES.md -Value ($lines -join "`n") -Encoding utf8
          Write-Host "---- release body ----"
          Get-Content RELEASE_NOTES.md -TotalCount 14

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          repository: Cheumklang/NTAPI-releases
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: NTAPI ${{ github.ref_name }}
          # The description lives in the source repo so it can be edited without
          # touching this workflow. Without it the public release page showed a
          # filename and nothing else, which tells a first-time visitor nothing
          # about what they are downloading.
          body_path: RELEASE_NOTES.md
          draft: false
          make_latest: 'true'
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            dist/NTAPI-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap