name: Prune old releases

# Older installers stay on the public download page forever. Anyone who lands on
# an old one and installs it gets a build from before sponsor banners existed —
# and then never sees a paid placement, however many are published afterwards.
# The updater does pull those users forward on its own, so a stale download is
# not a broken app, only a stale one; the point of this job is to stop handing
# those builds out.
#
# HOW MANY SURVIVE: two — the newest release, and the one before it. That is the
# whole reason the window exists: electron-updater diffs a new installer against
# the previous version's `.blockmap`, which it fetches from that release when
# there is no local copy (`AppUpdater.js`: "No cached blockmap for the old
# installer, downloading it from ..."). One release kept means every update is a
# full ~180 MB download again; two makes small updates possible.
#
# The user's rule (2026-11-21): the public download page must not turn into an
# archive. Every release retires the one that fell out of the window, so the repo
# holds ~360 MB instead of gigabytes.
#
# The window is also the promise the app makes to its users: an install that is
# more than `UPDATE_RETENTION` releases behind (`app/src/main.js`) is told to
# update *now*, because the blockmap its delta would need is gone.
#
# `keep=<version>` still forces the old "this version and newer" behaviour.
#
# Runs on its own after every successful Release (newest twenty kept, nothing
# else touched), and by hand in the Actions tab. Deleting a release cannot be
# undone, which is why the hand-run path asks for the number and confirms it,
# and why a commit-message marker still exists for the rare manual prune.
on:
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Keep how many of the newest releases (must be >= 2; 2 = the app update window)'
        required: true
        type: number
        default: 2
      keep:
        description: 'Optional override: keep this version and everything newer (e.g. v0.5.0). Empty = use keep_count'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'List what would be deleted, delete nothing'
        required: true
        type: boolean
        default: true
      delete_tags:
        description: 'Also delete those tags in this repo (keeps tag history clean)'
        required: true
        type: boolean
        default: false
  # GitHub refuses the Run workflow button on this repo ("You can't perform that
  # action at this time"), so the same job can be asked for by pushing any commit
  # whose message carries the marker. Two spellings, on purpose:
  #   [prune-releases keep=v0.5.0 dry-run]   lists only
  #   [prune-releases keep=v0.5.0 apply]     deletes
  # A commit message is not something anyone types by accident, and the job does
  # nothing at all when the marker is absent.
  push:
    branches: [master]
  # A published release is the moment the window slides: run without being asked
  # so the third release always retires the oldest, and nobody has to remember.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: prune-releases
  cancel-in-progress: false

jobs:
  prune:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      contains(github.event.head_commit.message, '[prune-releases')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete releases older than the kept version
        env:
          # Same token the release job uses: the assets live in a different repo.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TARGET_REPO: Cheumklang/NTAPI-releases
          KEEP_INPUT: ${{ inputs.keep }}
          COUNT_INPUT: ${{ inputs.keep_count }}
          DRY_INPUT: ${{ inputs.dry_run }}
          TAGS_INPUT: ${{ inputs.delete_tags }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            # The marker spells out both halves; a missing half means a typo, and
            # a typo here deletes releases.
            KEEP=$(printf '%s\n' "$COMMIT_MSG" | grep -o 'keep=[^ ]*' | head -n1 | cut -d= -f2 || true)
            if printf '%s\n' "$COMMIT_MSG" | grep -q 'apply'; then
              DRY_RUN=false
            elif printf '%s\n' "$COMMIT_MSG" | grep -q 'dry-run'; then
              DRY_RUN=true
            else
              echo "::error::marker needs 'apply' or 'dry-run' in it"
              exit 1
            fi
            # Tags are separate history; only touched when asked for by name.
            if printf '%s\n' "$COMMIT_MSG" | grep -q 'tags'; then TAGS=true; else TAGS=false; fi
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            # Automatic: a release just finished. Keep the window and nothing
            # else — never force a version and never delete tags.
            KEEP=""
            KEEP_COUNT="${NTAPI_UPDATE_RETENTION:-2}"
            DRY_RUN=false
            TAGS=false
          else
            KEEP="$KEEP_INPUT"
            KEEP_COUNT="$COUNT_INPUT"
            DRY_RUN="$DRY_INPUT"
            TAGS="$TAGS_INPUT"
          fi
          echo "keep=$KEEP keep_count=${KEEP_COUNT:-} dry_run=$DRY_RUN tags=$TAGS (event: $GITHUB_EVENT_NAME)"
          {
            echo "KEEP=$KEEP"
            echo "KEEP_COUNT=${KEEP_COUNT:-}"
            echo "DRY_RUN=$DRY_RUN"
            echo "DELETE_TAGS=$TAGS"
          } >> "$GITHUB_ENV"

          # tag<TAB>id for every release, newest first.
          gh api "repos/$TARGET_REPO/releases?per_page=100" --paginate \
            --jq '.[] | select(.draft == false) | "\(.tag_name)\t\(.id)"' > releases.tsv

          total=$(wc -l < releases.tsv)
          echo "releases found: $total"

          if [ -n "$KEEP" ]; then
            # Explicit version wins: "keep this and everything newer".
            MODE=version
            keep="${KEEP#v}"
            keep="${keep#V}"
            if ! printf '%s' "$keep" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'$KEEP' is not a version like v0.5.0"
              exit 1
            fi
            if ! cut -f1 releases.tsv | grep -qx "v$keep"; then
              # A typo here would either delete nothing or delete everything,
              # depending on which way the comparison leans. Refuse instead.
              echo "::error::v$keep has no published release — check the input"
              exit 1
            fi
          else
            # Default: the newest N releases survive. N must be at least 2 so the
            # previous blockmap is still downloadable for the next delta update.
            MODE=count
            if ! printf '%s' "${KEEP_COUNT:-2}" | grep -Eq '^[0-9]+$' || [ "${KEEP_COUNT:-2}" -lt 2 ]; then
              echo "::error::keep_count must be a whole number >= 2 (got '${KEEP_COUNT:-}')"
              exit 1
            fi
            keep="${KEEP_COUNT:-2}"
          fi

          deleted=0
          skipped=0
          index=0
          : > pruned.txt
          while IFS=$'\t' read -r tag id; do
            index=$((index + 1))
            if [ "$MODE" = "count" ]; then
              # releases.tsv is newest first, so the first N lines are what stays.
              if [ "$index" -le "$keep" ]; then
                skipped=$((skipped + 1))
                continue
              fi
            else
              ver="${tag#v}"
              ver="${ver#V}"
              # sort -V orders by version, so "lower than keep" is a real version
              # comparison and not a string one (0.10.0 must beat 0.9.0).
              lowest=$(printf '%s\n%s\n' "$ver" "$keep" | sort -V | head -n1)
              if [ "$ver" = "$keep" ] || [ "$lowest" != "$ver" ]; then
                skipped=$((skipped + 1))
                continue
              fi
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "would delete: $tag ($id)"
            else
              gh api -X DELETE "repos/$TARGET_REPO/releases/$id"
              echo "deleted: $tag ($id)"
            fi
            printf '%s\n' "$tag" >> pruned.txt
            deleted=$((deleted + 1))
          done < releases.tsv

          if [ "$MODE" = "count" ]; then
            KEPT_TEXT="the newest $keep release(s)"
          else
            KEPT_TEXT="v$keep and newer"
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run — $deleted release(s) outside '$KEPT_TEXT' would be deleted, $skipped kept"
          else
            echo "::notice::deleted $deleted release(s) outside '$KEPT_TEXT', $skipped kept"
          fi

          {
            echo "### Prune old releases"
            echo ""
            echo "- kept: $KEPT_TEXT"
            echo "- $([ "$DRY_RUN" = "true" ] && echo "would delete" || echo "deleted"): $deleted"
            echo "- untouched: $skipped"
            if [ -s pruned.txt ] && [ "$DRY_RUN" != "true" ]; then
              echo ""
              echo "<details><summary>tags</summary>"
              echo ""
              sed 's/^/- /' pruned.txt
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the same tags in this repo
        if: env.DELETE_TAGS == 'true' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          [ -s pruned.txt ] || { echo "nothing to tag-delete"; exit 0; }
          while read -r tag; do
            # A tag whose release is gone is dead history here too. The kept
            # version stays, so the changelog for the next release still has a
            # previous tag to compare against.
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              git push origin --delete "$tag"
              echo "deleted tag: $tag"
            else
              echo "tag already gone: $tag"
            fi
          done < pruned.txt
